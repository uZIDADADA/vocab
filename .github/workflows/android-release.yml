name: Android release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  build:
    name: Build signed Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOCAB_RELEASE_KEYSTORE_BASE64: ${{ secrets.VOCAB_RELEASE_KEYSTORE_BASE64 }}
      VOCAB_RELEASE_STORE_PASSWORD: ${{ secrets.VOCAB_RELEASE_STORE_PASSWORD }}
      VOCAB_RELEASE_KEY_ALIAS: ${{ secrets.VOCAB_RELEASE_KEY_ALIAS }}
      VOCAB_RELEASE_KEY_PASSWORD: ${{ secrets.VOCAB_RELEASE_KEY_PASSWORD }}
      VOCAB_RELEASE_STORE_TYPE: PKCS12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          expected_tag="v$app_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Tag %s does not match pubspec version %s.\n' \
              "$GITHUB_REF_NAME" "$app_version" >&2
            printf 'Use tag %s or update pubspec.yaml first.\n' \
              "$expected_tag" >&2
            exit 1
          fi

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VOCAB_RELEASE_KEYSTORE_BASE64 \
            VOCAB_RELEASE_STORE_PASSWORD \
            VOCAB_RELEASE_KEY_ALIAS \
            VOCAB_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          signing_keystore="$RUNNER_TEMP/vocab-release.p12"
          umask 077
          printf '%s' "$VOCAB_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$signing_keystore"
          keytool -list \
            -keystore "$signing_keystore" \
            -storetype "$VOCAB_RELEASE_STORE_TYPE" \
            -storepass "$VOCAB_RELEASE_STORE_PASSWORD" \
            -alias "$VOCAB_RELEASE_KEY_ALIAS" > /dev/null
          printf 'VOCAB_RELEASE_KEYSTORE=%s\n' "$signing_keystore" \
            >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed APKs and app bundle
        shell: bash
        run: |
          set -euo pipefail
          ./tool/build_android_release_apks.sh
          ./tool/build_android_release_aab.sh

      - name: Verify packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"
          if [[ -z "$apk_signer" ]]; then
            printf '%s\n' 'Android apksigner was not found.' >&2
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apk_signer" verify --verbose "$apk"
          done
          keytool -printcert \
            -jarfile build/app/outputs/bundle/release/app-release.aab > /dev/null
          sha256sum \
            build/app/outputs/flutter-apk/app-*-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            > build/app/outputs/SHA256SUMS.txt

      - name: Remove signing key from workspace
        if: always()
        shell: bash
        run: rm -f "$VOCAB_RELEASE_KEYSTORE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vocab-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/SHA256SUMS.txt
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            release_args=(
              "$GITHUB_REF_NAME"
              "${assets[@]}"
              --verify-tag
              --generate-notes
              --title "$GITHUB_REF_NAME"
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
